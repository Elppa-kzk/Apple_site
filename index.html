<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIZAWA APPLE FARM | 木沢りんご園 まもなく公開</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 作成中ページ専用の追加スタイル */
        .coming-soon-hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            margin-top: 70px;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('images/HAIKE1.JPG') center/cover no-repeat;
        }

        .coming-soon-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: var(--primary-light);
            border: 1px solid rgba(225, 29, 72, 0.3);
            color: var(--primary-color);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }

        .coming-soon-card h1 {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 15px;
            letter-spacing: -0.02em;
        }

        .coming-soon-card p {
            color: var(--text-sub);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            width: 70%;
            height: 100%;
            background: var(--primary-color);
            border-radius: 10px;
            animation: pulse 2s infinite ease-in-out;
        }

        .info-box {
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 480px) {
            .coming-soon-card {
                padding: 30px 20px;
            }
            .coming-soon-card h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body id="top">

    <!-- ヘッダー -->
    <header class="header">
        <div class="logo">
            <a href="index.html"><img src="images/s-KZK1.png" alt="KIZAWA APPLE FARM" /></a>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="access.html">アクセス</a></li>
                <li><a href="menu.html">メニュー</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインビジュアル（作成中案内） -->
    <div class="coming-soon-hero">
        <div class="coming-soon-card">
            <div class="badge">COMING SOON</div>
            <h1>ただいまリニューアル準備中</h1>
            <p>
                いつも木沢りんご園のホームページをご覧いただきありがとうございます。<br>
                より魅力的なサイトを目指して、現在デザインを一新して制作を進めております。
            </p>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="info-box">
                <p style="margin-bottom: 5px; font-weight: 600; color: var(--text-main);">【お問い合わせ・直売所について】</p>
                <p>茨城県大子町芦野倉524 / 電話：０２９５－７２－８０２０</p>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer>
        <div class="gotop">
            <a href="#top"><img src="images/YJI.png" alt="トップへ戻る" /></a>
        </div>
        <p class="copyright">&copy; KIZAWA APPLE FARM</p>
    </footer>

</body>
</html>
